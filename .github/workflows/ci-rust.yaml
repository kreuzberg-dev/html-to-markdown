name: CI Rust

on:
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "packages/*/native/**"
      - "packages/*/ext/**"
      - "packages/*/src/**"
      - "packages/*/rust/**"
      - "tools/benchmark-harness/**"
      - "tools/e2e-generator/**"
      - "e2e/rust/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "rustfmt.toml"
      - ".cargo/config.toml"
      - "fixtures/**"
      - ".github/workflows/ci-rust.yaml"
  pull_request:
    branches: [main]
    paths:
      - "crates/**"
      - "packages/*/native/**"
      - "packages/*/ext/**"
      - "packages/*/src/**"
      - "packages/*/rust/**"
      - "tools/benchmark-harness/**"
      - "tools/e2e-generator/**"
      - "e2e/rust/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "rustfmt.toml"
      - ".cargo/config.toml"
      - "fixtures/**"
      - ".github/workflows/ci-rust.yaml"
  workflow_dispatch: {}

concurrency:
  group: ci-rust-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: short
  BUILD_PROFILE: "ci"

permissions:
  contents: read

jobs:
  validate-rust:
    name: "Validate: Rust"
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Rust
        uses: xberg-io/actions/setup-rust@v1
        with:
          components: rustfmt, clippy, llvm-tools-preview

      - name: Install Task
        uses: xberg-io/actions/install-task@v1

      - name: Check Rust Formatting
        run: task rust:lint:check
        shell: bash

      - name: Run Clippy
        run: task rust:lint:check
        shell: bash

      - name: Check feature flags (html-to-markdown)
        shell: bash
        env:
          RUSTFLAGS: "-D warnings"
        run: |
          cargo check -p html-to-markdown-rs --no-default-features
          cargo check -p html-to-markdown-rs --no-default-features --features visitor
          cargo check -p html-to-markdown-rs --no-default-features --features metadata
          cargo check -p html-to-markdown-rs --no-default-features --features inline-images

      - name: Install alef
        uses: xberg-io/actions/install-alef@v1

      # ~keep `alef verify` prints "Stale bindings detected" but exits 0 without --exit-code,
      # so no workflow noticed the 371 generated files that had drifted from alef.toml.
      - name: Verify binding freshness
        run: alef verify --exit-code

  rust-tests:
    name: "Test: Rust (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        id: checkout

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"

      - name: Setup Rust
        uses: xberg-io/actions/setup-rust@v1
        with:
          components: rustfmt, clippy, llvm-tools-preview
          cache-key-prefix: rust-tests-${{ matrix.os }}

      - name: Install Task
        uses: xberg-io/actions/install-task@v1

      - name: Run Rust Tests
        env:
          RUST_BACKTRACE: full
        run: task rust:test:ci
        shell: bash

      - name: Run E2E Tests
        run: task rust:e2e:test
        shell: bash

      - name: Cleanup Rust cache
        if: always() && steps.checkout.outcome == 'success'
        uses: xberg-io/actions/cleanup-rust-cache@v1

  rust-coverage:
    name: "Coverage: Rust"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Rust
        uses: xberg-io/actions/setup-rust@v1
        with:
          components: rustfmt, clippy, llvm-tools-preview

      - name: Install Task
        uses: xberg-io/actions/install-task@v1

      - name: Generate Rust Coverage
        run: task rust:coverage:check
        shell: bash

      - name: Upload Coverage Artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-report-${{ github.sha }}
          path: rust-coverage.lcov
          retention-days: 7

  # ~keep The benchmark harness (tools/benchmark-harness) and its regression
  # thresholds (tools/benchmark-harness/baselines/baseline.json, default 10% max
  # regression per group) already existed and already enforce a real failure
  # condition in `bench compare` — nothing in CI ever ran it (html-to-markdown
  # audit #19). Wired here as a real, blocking gate rather than a no-op.
  # Pinned to a single Linux runner (not a matrix) to keep wall-clock timing
  # comparisons meaningful — shared-runner noise can still cause false positives
  # on tight margins; if this proves flaky in practice the fix is to widen the
  # per-group threshold in baseline.json, not to make the job non-blocking.
  benchmark-regression:
    name: "Benchmark: Regression guardrail"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        id: checkout

      - name: Setup Rust
        uses: xberg-io/actions/setup-rust@v1
        with:
          cache-key-prefix: benchmark-regression

      - name: Install Task
        uses: xberg-io/actions/install-task@v1

      - name: Run benchmark harness
        run: task bench:run
        shell: bash

      - name: Compare against baseline (fails on regression beyond threshold)
        run: task bench:compare
        shell: bash

      - name: Cleanup Rust cache
        if: always() && steps.checkout.outcome == 'success'
        uses: xberg-io/actions/cleanup-rust-cache@v1
