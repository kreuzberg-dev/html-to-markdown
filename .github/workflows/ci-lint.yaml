name: CI Lint

on:
  push:
    branches: [main]
    paths:
      - ".ai-rulez/**"
      - "**/*.rs"
      - "**/*.py"
      - "**/*.ts"
      - "**/*.rb"
      - "**/*.php"
      - "**/*.go"
      - "**/*.java"
      - "**/*.ex"
      - "**/*.exs"
      - "**/*.R"
      - "**/*.sh"
      - "**/*.toml"
      - "**/*.yml"
      - "**/*.yaml"
      - "**/*.json"
      - "alef.toml"
      - ".github/workflows/ci-lint.yaml"
  pull_request:
    branches: [main]
    paths:
      - ".ai-rulez/**"
      - "**/*.rs"
      - "**/*.py"
      - "**/*.ts"
      - "**/*.rb"
      - "**/*.php"
      - "**/*.go"
      - "**/*.java"
      - "**/*.ex"
      - "**/*.exs"
      - "**/*.R"
      - "**/*.sh"
      - "**/*.toml"
      - "**/*.yml"
      - "**/*.yaml"
      - "**/*.json"
      - "alef.toml"
      - ".github/workflows/ci-lint.yaml"
  workflow_dispatch: {}

concurrency:
  group: ci-lint-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    uses: xberg-io/actions/.github/workflows/reusable-validate.yml@v1
    with:
      setup-rust: true
      setup-python: true
      # poly's checkstyle whole-project check runs `mvn checkstyle:check`;
      # checkstyle 13+ requires JDK 21+ (defaulted by java-version).
      setup-java: true
      # The remaining whole-project checks poly runs (golangci-lint, rubocop, steep,
      # dart-analyze, credo) each need their own toolchain. Without them this job
      # skipped poly's workspace phase entirely, so those five linters ran only in
      # the git hooks and CI never saw them. ~keep
      setup-go: true
      setup-ruby: true
      setup-dart: true
      setup-elixir: true
      check-fixture-snippets: true
      alef-version: 0.60.1
