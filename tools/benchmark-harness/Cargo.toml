[package]
name = "html-to-markdown-bench"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Benchmark harness and golden oracle for html-to-markdown-rs"
publish = false

[package.metadata.cargo-machete]
# Kept available for golden-oracle diff assertions; not currently referenced.
ignored = ["pretty_assertions"]

[lib]
name = "html_to_markdown_bench"
path = "src/lib.rs"

[[bin]]
name = "htmbench"
path = "src/main.rs"

[features]
default = []
# Enable testkit for --force-tier1 benchmarking.
testkit = ["html-to-markdown-rs/testkit"]

[dependencies]
anyhow = "1"
clap = { version = "4.6", features = ["derive"] }
# ~keep Feature set must mirror the shipped CLI (crates/html-to-markdown-cli:
# metadata, inline-images, visitor, serde) so `task bench:run` measures the
# artifact users actually install, not a superset/subset of it. `testkit` is
# opt-in here (via this crate's own `testkit` feature, --force-tier1 only) to
# match the CLI, which does not ship with it.
html-to-markdown-rs = { path = "../../crates/html-to-markdown", default-features = false, features = [
  "metadata",
  "inline-images",
  "visitor",
  "serde",
] }
humantime = "2"
pretty_assertions = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tl.workspace = true
toml = "1.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
walkdir = "2"

[dev-dependencies]
# Optional comparison vs upstream mdream (run examples/mdream_compare.rs).
# Pinned via Cargo.lock; not used by production code.
mdream = "1.0"

# ~keep This example imports `html_to_markdown_rs::testkit` directly, so it cannot
# build unless the feature is on. `src/main.rs` cfg-gates its own testkit use, but
# an example has no such escape hatch and would break `--all-targets`.
[[example]]
name = "tier1_routing"
path = "examples/tier1_routing.rs"
required-features = ["testkit"]

# ~keep Isolates each convert_html_impl stage (byte preprocessing, tl::parse,
# build_dom_context, has_inline_block_misnest) for phase-level timing; needs
# testkit to reach the pub(crate) converter internals it profiles directly.
[[example]]
name = "profile_deep_nesting_phases"
path = "examples/profile_deep_nesting_phases.rs"
required-features = ["testkit"]

# ~keep Cargo rejects mixing `lints.workspace = true` with per-lint overrides, so this
# mirrors the workspace set minus `pedantic`/`nursery`, which a timing harness trips by
# construction. `print_stdout`/`print_stderr`/`dbg_macro` stay denied per the repo's
# tracing-only rule; the result-output sites opt back in with `#[expect]`.
[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unused_must_use = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
cargo = { level = "warn", priority = -1 }
print_stdout = "deny"
print_stderr = "deny"
dbg_macro = "deny"
multiple_crate_versions = { level = "allow", priority = 1 }
cargo_common_metadata = { level = "allow", priority = 1 }
must_use_candidate = { level = "allow", priority = 1 }
cast_possible_truncation = { level = "allow", priority = 1 }
cast_sign_loss = { level = "allow", priority = 1 }
cast_precision_loss = { level = "allow", priority = 1 }
needless_pass_by_value = { level = "allow", priority = 1 }
redundant_closure_for_method_calls = { level = "allow", priority = 1 }
doc_markdown = { level = "allow", priority = 1 }
format_push_string = { level = "allow", priority = 1 }
uninlined_format_args = { level = "allow", priority = 1 }
struct_field_names = { level = "allow", priority = 1 }
