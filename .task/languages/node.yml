version: "3"
internal: true

tasks:
  audit:
    desc: "Check Node.js dependencies for known vulnerabilities (pnpm audit)"
    silent: false
    cmds:
      - cmd: pnpm audit --audit-level=high
        ignore_error: false

  update:
    desc: "Update Node.js dependencies within major versions (pnpm up)"
    silent: false
    cmds:
      - cmd: |
          cd packages/typescript && pnpm up
        ignore_error: false
      - cmd: |
          cd crates/html-to-markdown-wasm && pnpm up
        ignore_error: false

  upgrade:
    desc: "Upgrade Node.js dependencies to latest including breaking changes (pnpm up --latest)"
    silent: false
    cmds:
      - cmd: |
          cd packages/typescript && pnpm up --latest
        ignore_error: false
      - cmd: |
          cd crates/html-to-markdown-wasm && pnpm up --latest --latest
        ignore_error: false
