[package]
name = "html-to-markdown-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme.workspace = true
rust-version.workspace = true
description = "Command-line interface for html-to-markdown - high-performance HTML to Markdown converter"
keywords = ["html", "markdown", "cli", "converter", "html5ever"]
categories = ["command-line-utilities", "text-processing"]

[[bin]]
name = "html-to-markdown"
path = "src/main.rs"

[features]
default = ["mcp", "mcp-http"]
mcp = ["html-to-markdown-rs/mcp", "dep:tokio"]
mcp-http = ["mcp", "html-to-markdown-rs/mcp-http"]

[dependencies]
base64.workspace = true
clap.workspace = true
clap_complete.workspace = true
clap_mangen.workspace = true
encoding_rs.workspace = true
html-to-markdown-rs = { workspace = true, features = ["metadata", "inline-images", "visitor", "serde"] }
reqwest = { version = "0.13.4", default-features = false, features = [
  "blocking",
  "rustls",
  "gzip",
  "deflate",
  "charset",
] }
serde_json = "1.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros"], optional = true }
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
assert_cmd = "2.2"
predicates = "3.1"
tempfile = "3.27"

[lints]
workspace = true
