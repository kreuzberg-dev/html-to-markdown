[package]
name = "html-to-markdown-rs-dart"
version = "3.10.6"
edition = "2024"
license = "MIT"

[package.metadata.cargo-machete]
# Umbrella + sibling crates are pulled in so flutter_rust_bridge can resolve
# every referenced type, but the generated Rust wrapper only `use`s a subset.
ignored = ["async-trait", "html_to_markdown_rs", "tracing"]

[lib]
crate-type = ["cdylib", "staticlib"]
[features]
# ~keep `testkit` is required to COMPILE, not to test: the alef-generated bridge
# references `TierStrategy::Tier1` unconditionally, but that variant is
# `#[cfg(any(test, feature = "testkit"))]` in the core crate. See audit #9 / ALEF-A21.
default = ["inline-images", "metadata", "testkit", "visitor"]
inline-images = ["html_to_markdown_rs/inline-images"]
metadata = ["html_to_markdown_rs/metadata"]
testkit = ["html_to_markdown_rs/testkit"]
visitor = ["html_to_markdown_rs/visitor"]

[dependencies]
async-trait = "0.1"
flutter_rust_bridge = "=2.12.0"
html_to_markdown_rs = { path = "../../../crates/html-to-markdown", package = "html-to-markdown-rs", features = ["full", "testkit"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }
tracing = "0.1"

# ~keep Binding crates cannot use `lints.workspace = true`: the workspace forbids
# `unsafe_code`, `forbid` is not overridable by an inner `allow`, and Cargo rejects
# mixing `workspace = true` with per-lint overrides. Generated binding glue is
# unsafe by construction. `pedantic`/`nursery`/`cargo` are deliberately NOT mirrored:
# the bridge source is alef-generated and carries a DO NOT EDIT header, so those style
# findings are unfixable here and would only be satisfiable in the generator. What
# remains is the set this repo can actually act on.
[lints.rust]
unsafe_code = "allow"
# ~keep flutter_rust_bridge generates the crate root and the build script.
missing_docs = "allow"
unused_must_use = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(alef)', 'cfg(feature, values("testkit"))', 'cfg(frb_expand)'] }

[lints.clippy]
all = { level = "deny", priority = -1 }
print_stdout = "deny"
print_stderr = "deny"
dbg_macro = "deny"
# ~keep Emitted by the generated bridge itself, so unfixable in this repo.
match_same_arms = { level = "allow", priority = 1 }
map_unwrap_or = { level = "allow", priority = 1 }
uninlined_format_args = { level = "allow", priority = 1 }
