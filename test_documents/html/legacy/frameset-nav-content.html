<h1>Springfield Public Library - Catalog System</h1>
<p>This site uses frames, but your browser does not support them, or they
are currently disabled.</p>
<p>The Springfield Public Library online catalog has been available to
patrons since 1998. It allows you to search the full holdings of all three
branch locations, place holds on circulating items, and renew items you
currently have checked out.</p>
<p>Please use the links below to navigate the catalog without frames:</p>
<ul>
<li><a href="nav.html">Navigation Menu</a> - browse by subject, author, or branch</li>
<li><a href="header.html">Site Header</a> - library hours and contact information</li>
<li><a href="content.html">Catalog Search</a> - search the full catalog</li>
<li><a href="sidebar.html">Sidebar</a> - new arrivals and staff picks</li>
</ul>
<p>For the best experience, please enable frames or upgrade to a
frames-capable browser. Patrons using screen readers or text-only browsers
should use the non-framed links above, as the catalog search functionality
is otherwise only reachable through the frameset navigation.</p>
