# Manifest of the real-world / structurally-diverse HTML test corpus.
#
# Each [[document]] entry records, for one file under this directory:
#   path        - relative path from this file's directory (test_documents/html/)
#   family      - the generator/producer this fixture exercises (one directory per family)
#   source      - the origin URL, or "synthesized" for a hand-built fixture
#   license     - the license governing the vendored content, or an "N/A (original work)"
#                 note for synthesized fixtures (original authorship, MIT via this repo)
#   retrieved   - ISO 8601 date the content was captured/authored
#   synthesized - true for hand-built fixtures that mimic a generator's known structural
#                 signature (no live document was captured); false for vendored/real content
#   features    - one line on the structural constructs this fixture exercises
#
# See ATTRIBUTIONS.md for full attribution text on every vendored (non-synthesized) source.
#
# Loaded by crates/html-to-markdown/tests/support/mod.rs, which the corpus-consuming test
# files use to enumerate and cross-check this corpus (see manifest_consistency_test.rs).

